name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Keep the published snapshot and its acknowledgements in deployment order.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A retry rebuilds and prepares against current production state before
    # publishing, including when an older workflow run is retried.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '^26.12.1'
          check-latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: corepack prepare
      - run: yarn install --immutable
      - run: yarn build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore IndexNow production state
        if: github.repository == 'tus/tus.io' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@v6
        with:
          path: .cache/indexnow/state.json
          key:
            indexnow-production-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-production-

      - name: Prepare changed URLs for IndexNow
        id: indexnow
        if: github.repository == 'tus/tus.io' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/indexnow.mjs prepare

      - uses: actions/upload-pages-artifact@v5
        with:
          path: './dist/'
          # Artifact names are immutable within a run. Each retry has a fresh build.
          name: github-pages-${{ github.run_attempt }}

      - uses: actions/deploy-pages@v5
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Submit changed URLs to IndexNow
        if:
          steps.indexnow.outcome == 'success' && steps.deployment.outcome ==
          'success' && github.repository == 'tus/tus.io' && github.ref ==
          'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/indexnow.mjs submit

      - name: Save IndexNow production state
        # Failed preparation may leave a partial file; publish no recovery archive.
        if:
          always() && steps.indexnow.outcome == 'success' &&
          steps.deployment.outcome == 'success' && github.repository ==
          'tus/tus.io' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@v6
        with:
          path: .cache/indexnow/state.json
          key:
            indexnow-production-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Archive IndexNow production state
        if:
          always() && steps.indexnow.outcome == 'success' &&
          steps.deployment.outcome == 'success' && github.repository ==
          'tus/tus.io' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name:
            indexnow-production-state-${{ steps.indexnow.outputs.generation }}
          path: .cache/indexnow/state.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: ignore
